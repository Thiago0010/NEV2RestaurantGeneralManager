# =============================================================
# Nginx - Configuração de produção (Oracle Cloud)
# - Serve o frontend React (build estático)
# - Faz proxy reverso do /api/ e /ws/ pro backend
# - Suporte a WebSocket, gzip, cache de assets, security headers
# =============================================================

server {
    listen 80;
    server_name _;

    # Logs (vão pro stdout do container - docker logs)
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Raiz do frontend
    root /usr/share/nginx/html;
    index index.html;

    # -------- Security Headers --------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP permissivo o suficiente pro React + Radix + Leaflet
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' ws: wss: https:;" always;

    # -------- Gzip --------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # -------- Cache de assets estáticos --------
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # -------- Frontend SPA (React Router) --------
    # Tudo que não for arquivo estático ou /api/ cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------- API REST --------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -------- WebSocket (pedidos em tempo real) --------
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;   # 24h - mantém conexão viva
        proxy_send_timeout 86400s;
    }

    # -------- Bloqueia acesso a arquivos ocultos (.git, .env, etc) --------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
