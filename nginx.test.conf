# =============================================================
# nginx.test.conf
# Nginx local pra simular o ambiente de produção
# Roda no seu Windows, serve o dist/ + faz proxy pro backend
#
# Como usar:
#   1. Instale o nginx no Windows (ou use o que vem com Docker Desktop)
#   2. Copie esse arquivo pra pasta de config do nginx
#   3. Inicie o nginx
# =============================================================

server {
    listen 80;
    server_name localhost;

    # Caminho do build do frontend (ajuste se seu caminho for diferente)
    root C:/Users/Thiago/OneDrive/Desktop/Restaurant-NEV2-MANAGER/dist;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Cache de assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API pro backend local (rodando em :8000)
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
