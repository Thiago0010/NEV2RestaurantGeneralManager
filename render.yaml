# =============================================================
# render.yaml - Infra-as-code do Render
# Sobe backend + redis + frontend automaticamente
# Conecta no Supabase Postgres (externo)
#
# COMO USAR:
#   1. Suba o código no GitHub
#   2. Render Dashboard → New → Blueprint
#   3. Conecta o repo, Render lê esse arquivo
#   4. Adicione a DATABASE_URL do Supabase manualmente
#   5. Configure UptimeRobot pra pingar a cada 5min
# =============================================================

services:
  # ----------------------------------------------------------
  # Backend FastAPI (Web Service)
  # ----------------------------------------------------------
  - type: web
    name: nev2-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Postgres do Supabase (você cola manualmente depois)
      - key: DATABASE_URL
        sync: false
      # Redis interno do Render
      - key: REDIS_URL
        value: "redis://nev2-redis:6379/0"
      # Segurança - Render gera automaticamente
      - key: SECRET_KEY
        generateValue: true
      - key: SECRET_KEY_REGISTER
        value: ""
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      # URLs - ATUALIZE depois do primeiro deploy com a URL real
      - key: CORS_ORIGINS
        value: '["https://nev2-frontend.onrender.com"]'
      - key: BASE_URL
        value: "https://nev2-frontend.onrender.com"
      - key: FRONTEND_URL
        value: "https://nev2-frontend.onrender.com"
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "[NEV]2 Restaurant Management System"
      - key: APP_VERSION
        value: "1.0.0"
      # Mercado Pago (vazio por padrão - adicione se for usar)
      - key: MP_ACCESS_TOKEN
        value: ""
      - key: MP_PUBLIC_KEY
        value: ""
      - key: MP_PRICE_ESSENCIAL
        value: "9900"
      - key: MP_PRICE_PROFISSIONAL
        value: "19900"
      - key: MP_PRICE_ESCALA
        value: "39900"
      - key: PYTHONUNBUFFERED
        value: "1"

  # ----------------------------------------------------------
  # Redis (Key-Value Store)
  # ----------------------------------------------------------
  - type: redis
    name: nev2-redis
    plan: free
    region: oregon

  # ----------------------------------------------------------
  # Frontend React (Static Site)
  # ----------------------------------------------------------
  - type: static
    name: nev2-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: "npm ci && npm run build"
    publishPath: "./dist"
    autoDeploy: true
    envVars:
      # IMPORTANTE: substitua pela URL real do backend depois do deploy
      - key: VITE_API_URL
        value: "https://nev2-backend.onrender.com/api/v1"
      - key: VITE_WS_URL
        value: "wss://nev2-backend.onrender.com/ws"
    # Roteamento:
    # - /api/* e /ws/* → proxya pro backend
    # - resto → index.html (SPA do React)
    routes:
      - type: rewrite
        source: /api/*
        destination: https://nev2-backend.onrender.com/api/*
      - type: rewrite
        source: /ws/*
        destination: https://nev2-backend.onrender.com/ws/*
      - type: rewrite
        source: /*
        destination: /index.html

# =============================================================
# APÓS O PRIMEIRO DEPLOY, AJUSTE:
#   - DATABASE_URL  → cole a connection string do Supabase
#   - CORS_ORIGINS  → URL real do frontend
#   - BASE_URL      → URL real do frontend
#   - VITE_API_URL  → URL real do backend (e refazer deploy do frontend)
#   - VITE_WS_URL   → wss://... do backend (e refazer deploy do frontend)
# =============================================================
